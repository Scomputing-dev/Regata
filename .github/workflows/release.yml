name: Package Regata for Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish self-contained Windows app
        run: dotnet publish desktop/Regata.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - name: Create download archive
        run: Compress-Archive -Path publish/* -DestinationPath Regata-Windows-x64.zip
        shell: pwsh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view "$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" publish/Regata.Desktop.exe Regata-Windows-x64.zip --clobber
          } else {
            gh release create "$tag" publish/Regata.Desktop.exe Regata-Windows-x64.zip --title "Regata $tag" --generate-notes
          }
        shell: pwsh
